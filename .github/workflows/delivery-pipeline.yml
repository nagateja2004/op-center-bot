name: RAG delivery pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opcenter-delivery
  cancel-in-progress: false

jobs:
  deploy-candidate:
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_HOST: ${{ secrets.STAGING_SSH_HOST }}
      DEPLOY_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.STAGING_SSH_USER }}
      DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure staging SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy candidate to staging
        run: bash scripts/deploy_remote.sh

  quality-gate:
    needs: deploy-candidate
    uses: ./.github/workflows/evaluation-gate.yml
    with:
      backend_url: ${{ vars.STAGING_RAG_BACKEND_URL }}
      full_dataset: ${{ github.event_name != 'pull_request' }}
    secrets:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      EVALUATION_API_TOKEN: ${{ secrets.EVALUATION_API_TOKEN }}

  release-production:
    if: github.event_name != 'pull_request'
    needs: quality-gate
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      DEPLOY_PORT: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Release the evaluated commit
        run: bash scripts/deploy_remote.sh
